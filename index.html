<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You just got doxxed</title>

  <!-- Leaflet CSS for the interactive map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      background: #071921;
    }

    /* Full-screen background map */
    #map {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /* Centered Frosted-Glass Info Card */
    .info-card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1000;
      width: 340px;
      padding: 24px 28px;
      border-radius: 14px;
      background: rgba(18, 22, 26, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      color: #ffffff;
    }

    .card-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #9aa5b1;
      margin-bottom: 18px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 95px 1fr;
      row-gap: 14px;
      column-gap: 12px;
      font-size: 13px;
      align-items: center;
    }

    .label {
      color: #828d99;
      font-weight: 500;
    }

    .value {
      color: #f0f4f8;
      font-weight: 500;
      word-break: break-word;
    }

    .gps-btn {
      margin-top: 20px;
      width: 100%;
      padding: 9px 12px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .gps-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    /* Hidden IP Logger Panel */
    .ip-panel {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2000;
      width: 500px;
      max-height: 400px;
      background: rgba(10, 14, 18, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 20px;
      color: #fff;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.02);
      overflow-y: auto;
    }

    .ip-panel.active {
      display: block;
    }

    .ip-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .ip-panel-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #c0c8d0;
      text-shadow: 0 0 10px rgba(100, 150, 200, 0.3);
    }

    .ip-panel-close {
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ff6b6b;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.3s;
    }

    .ip-panel-close:hover {
      background: rgba(255, 107, 107, 0.2);
      border-color: #ff6b6b;
    }

    .ip-entry {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ip-entry-info {
      color: #a0a8b0;
    }

    .ip-entry-copy {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.3s;
    }

    .ip-entry-copy:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: #ff6b6b;
      color: #ff6b6b;
    }

    .ip-panel-copy-all {
      margin-top: 15px;
      width: 100%;
      padding: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      transition: all 0.3s;
    }

    .ip-panel-copy-all:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: #ff6b6b;
    }

    .empty-message {
      text-align: center;
      color: #666;
      padding: 20px;
      font-style: italic;
    }

    /* Hide default Leaflet zoom buttons for a cleaner look */
    .leaflet-control-zoom {
      display: none;
    }

    /* Overlay when panel is open */
    .overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1500;
    }

    .overlay.active {
      display: block;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Overlay -->
  <div class="overlay" id="overlay"></div>

  <!-- Main Info Card -->
  <div class="info-card">
    <div class="card-title">Your Info</div>
    <div class="info-grid">
      <div class="label">Browser</div>
      <div class="value" id="browser">Detecting...</div>

      <div class="label">OS</div>
      <div class="value" id="os">Detecting...</div>

      <div class="label">Screen</div>
      <div class="value" id="screen">Detecting...</div>

      <div class="label">Language</div>
      <div class="value" id="language">Detecting...</div>

      <div class="label">Location</div>
      <div class="value" id="location">Locating...</div>

      <div class="label">IP Address</div>
      <div class="value" id="ip">Fetching...</div>
    </div>

    <button class="gps-btn" onclick="useExactGPS()">Pinpoint Exact GPS Location</button>
  </div>

  <!-- Hidden IP Logger Panel -->
  <div class="ip-panel" id="ipPanel">
    <div class="ip-panel-header">
      <span class="ip-panel-title">☠ IP Logger ☠</span>
      <button class="ip-panel-close" onclick="toggleIPPanel()">✕</button>
    </div>
    <div id="ipEntries"></div>
    <button class="ip-panel-copy-all" onclick="copyAllIPs()">Copy All Logged IPs</button>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Store IP logs
    let ipLogs = [];

    // 1. Initialize the Satellite Map
    const map = L.map('map', {
      center: [20, 0],
      zoom: 2,
      worldCopyJump: true
    });

    // Esri World Imagery Satellite Tiles
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri'
    }).addTo(map);

    let marker = null;

    function updateMapLocation(lat, lon, labelText, zoomLevel = 10) {
      map.flyTo([lat, lon], zoomLevel, { duration: 2.5 });
      if (marker) {
        marker.setLatLng([lat, lon]).setPopupContent(labelText);
      } else {
        marker = L.marker([lat, lon]).addTo(map).bindPopup(labelText).openPopup();
      }
    }

    // 2. Detect Browser, OS, Screen, and Language
    function getBrowserInfo() {
      const ua = navigator.userAgent;
      let match = ua.match(/(firefox|msie|trident|chrome|safari|edg|opr)\/?\s*(\d+)/i) || [];
      if (/trident/i.test(match[1])) return 'IE';
      if (match[1] === 'Chrome') {
        const edgeOrOpera = ua.match(/\b(OPR|Edg)\/(\d+)/);
        if (edgeOrOpera) return edgeOrOpera[0].replace('OPR', 'Opera').replace('Edg', 'Edge').replace('/', ' ');
      }
      return match[1] ? `${match[1]} ${match[2]}` : 'Unknown';
    }

    function getOSInfo() {
      const ua = navigator.userAgent;
      if (ua.includes('Win')) return 'Windows 10/11';
      if (ua.includes('Mac')) return 'macOS';
      if (ua.includes('Linux')) return 'Linux';
      if (ua.includes('Android')) return 'Android';
      if (/iPhone|iPad|iPod/.test(ua)) return 'iOS';
      return 'Unknown OS';
    }

    document.getElementById('browser').textContent = getBrowserInfo();
    document.getElementById('os').textContent = getOSInfo();
    document.getElementById('screen').textContent = `${window.screen.width}×${window.screen.height}`;
    document.getElementById('language').textContent = navigator.language || 'Unknown';

    // 3. Automatic IP-Based Location
    fetch('https://ipwho.is/')
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          document.getElementById('location').textContent = `${data.city}, ${data.region_code}, ${data.country_code}`;
          document.getElementById('ip').textContent = data.ip;
          updateMapLocation(data.latitude, data.longitude, `Approx: ${data.city}, ${data.country}`, 9);
          
          // Log the IP
          logIP(data.ip, `${data.city}, ${data.country}`);
        } else {
          document.getElementById('location').textContent = 'Unavailable';
        }
      })
      .catch(() => {
        document.getElementById('location').textContent = 'Blocked / Unavailable';
        document.getElementById('ip').textContent = 'Hidden';
      });

    // 4. Optional Exact GPS Location
    function useExactGPS() {
      if (!navigator.geolocation) {
        alert('Geolocation is not supported by your browser.');
        return;
      }
      document.getElementById('location').textContent = 'Requesting GPS...';
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude, longitude } = pos.coords;
          document.getElementById('location').textContent = `${latitude.toFixed(4)}, ${longitude.toFixed(4)}`;
          updateMapLocation(latitude, longitude, 'Your Exact Location', 14);
        },
        () => {
          document.getElementById('location').textContent = 'GPS Permission Denied';
        }
      );
    }

    // 5. IP Logger Functions
    function logIP(ip, location) {
      const logEntry = {
        ip: ip,
        location: location,
        timestamp: new Date().toLocaleString()
      };
      ipLogs.push(logEntry);
      updateIPPanel();
    }

    function updateIPPanel() {
      const container = document.getElementById('ipEntries');
      if (ipLogs.length === 0) {
        container.innerHTML = '<div class="empty-message">No IPs logged yet...</div>';
        return;
      }

      container.innerHTML = ipLogs.map((log, index) => `
        <div class="ip-entry">
          <div class="ip-entry-info">
            <strong>${log.ip}</strong> - ${log.location}<br>
            <small style="color: #666">${log.timestamp}</small>
          </div>
          <button class="ip-entry-copy" onclick="copyIP(${index})">Copy</button>
        </div>
      `).join('');
    }

    function copyIP(index) {
      const log = ipLogs[index];
      const text = `IP: ${log.ip}\nLocation: ${log.location}\nTime: ${log.timestamp}`;
      navigator.clipboard.writeText(text).then(() => {
        alert('IP copied to clipboard!');
      });
    }

    function copyAllIPs() {
      if (ipLogs.length === 0) {
        alert('No IPs logged yet.');
        return;
      }

      const text = ipLogs.map(log => 
        `IP: ${log.ip}\nLocation: ${log.location}\nTime: ${log.timestamp}\n---`
      ).join('\n');

      navigator.clipboard.writeText(text).then(() => {
        alert('All IPs copied to clipboard!');
      });
    }

    // 6. Toggle IP Panel
    function toggleIPPanel() {
      const panel = document.getElementById('ipPanel');
      const overlay = document.getElementById('overlay');
      panel.classList.toggle('active');
      overlay.classList.toggle('active');
      updateIPPanel();
    }

    // 7. Keyboard listener for F4
    document.addEventListener('keydown', (e) => {
      if (e.key === 'F4') {
        e.preventDefault();
        toggleIPPanel();
      }
    });

    // Close panel when clicking overlay
    document.getElementById('overlay').addEventListener('click', toggleIPPanel);

    // Initialize the panel
    updateIPPanel();
  </script>
</body>
</html>
