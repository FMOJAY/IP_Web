<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You just got doxxed</title>

  <!-- Leaflet CSS for the interactive map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      background: #071921;
    }

    /* Full-screen background map */
    #map {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /* Centered Frosted-Glass Info Card */
    .info-card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1000;
      width: 340px;
      padding: 24px 28px;
      border-radius: 14px;
      background: rgba(18, 22, 26, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      color: #ffffff;
    }

    .card-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #9aa5b1;
      margin-bottom: 18px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 95px 1fr;
      row-gap: 14px;
      column-gap: 12px;
      font-size: 13px;
      align-items: center;
    }

    .label {
      color: #828d99;
      font-weight: 500;
    }

    .value {
      color: #f0f4f8;
      font-weight: 500;
      word-break: break-word;
    }

    .gps-btn {
      margin-top: 20px;
      width: 100%;
      padding: 9px 12px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .gps-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    /* Hidden IP Logger Panel */
    .ip-panel {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2000;
      width: 600px;
      max-height: 500px;
      background: rgba(10, 14, 18, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 20px;
      color: #fff;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.02);
      overflow-y: auto;
    }

    .ip-panel.active {
      display: block;
    }

    .ip-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .ip-panel-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #c0c8d0;
      text-shadow: 0 0 10px rgba(100, 150, 200, 0.3);
    }

    .ip-panel-close {
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ff6b6b;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.3s;
    }

    .ip-panel-close:hover {
      background: rgba(255, 107, 107, 0.2);
      border-color: #ff6b6b;
    }

    .ip-entry {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ip-entry-info {
      color: #a0a8b0;
      flex: 1;
    }

    .ip-entry-actions {
      display: flex;
      gap: 5px;
    }

    .ip-entry-copy {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.3s;
    }

    .ip-entry-copy:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: #ff6b6b;
      color: #ff6b6b;
    }

    .ip-entry-delete {
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid rgba(255, 107, 107, 0.3);
      color: #ff6b6b;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.3s;
    }

    .ip-entry-delete:hover {
      background: rgba(255, 107, 107, 0.3);
      border-color: #ff6b6b;
    }

    .ip-panel-copy-all {
      margin-top: 15px;
      width: 48%;
      padding: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      transition: all 0.3s;
    }

    .ip-panel-copy-all:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: #ff6b6b;
    }

    .ip-panel-clear-all {
      margin-top: 15px;
      width: 48%;
      padding: 10px;
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid rgba(255, 107, 107, 0.3);
      border-radius: 8px;
      color: #ff6b6b;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      transition: all 0.3s;
      float: right;
    }

    .ip-panel-clear-all:hover {
      background: rgba(255, 107, 107, 0.3);
      border-color: #ff6b6b;
    }

    .empty-message {
      text-align: center;
      color: #666;
      padding: 20px;
      font-style: italic;
    }

    .ip-count {
      font-size: 11px;
      color: #888;
      margin-top: 10px;
      text-align: center;
    }

    /* Whitelist Management Section */
    .whitelist-section {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .whitelist-title {
      font-size: 12px;
      font-weight: 600;
      color: #888;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .whitelist-input {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: #fff;
      font-size: 12px;
    }

    .whitelist-input::placeholder {
      color: #666;
    }

    .whitelist-input:focus {
      outline: none;
      border-color: #ff6b6b;
    }

    .whitelist-add-btn {
      width: 100%;
      padding: 8px;
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid rgba(255, 107, 107, 0.3);
      border-radius: 6px;
      color: #ff6b6b;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.3s;
    }

    .whitelist-add-btn:hover {
      background: rgba(255, 107, 107, 0.3);
    }

    .whitelist-list {
      margin-top: 10px;
    }

    .whitelist-entry {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      margin-bottom: 4px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      font-size: 11px;
    }

    .whitelist-email {
      color: #a0a8b0;
    }

    .whitelist-remove {
      background: none;
      border: none;
      color: #ff6b6b;
      cursor: pointer;
      font-size: 14px;
      padding: 0 4px;
    }

    .whitelist-remove:hover {
      color: #ff0000;
    }

    /* Hide default Leaflet zoom buttons for a cleaner look */
    .leaflet-control-zoom {
      display: none;
    }

    /* Overlay when panel is open */
    .overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1500;
    }

    .overlay.active {
      display: block;
    }

    /* Scrollbar styling */
    .ip-panel::-webkit-scrollbar {
      width: 8px;
    }

    .ip-panel::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }

    .ip-panel::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .ip-panel::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 107, 107, 0.5);
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Overlay -->
  <div class="overlay" id="overlay"></div>

  <!-- Main Info Card -->
  <div class="info-card">
    <div class="card-title">Your Info</div>
    <div class="info-grid">
      <div class="label">Browser</div>
      <div class="value" id="browser">Detecting...</div>

      <div class="label">OS</div>
      <div class="value" id="os">Detecting...</div>

      <div class="label">Screen</div>
      <div class="value" id="screen">Detecting...</div>

      <div class="label">Language</div>
      <div class="value" id="language">Detecting...</div>

      <div class="label">Location</div>
      <div class="value" id="location">Locating...</div>

      <div class="label">IP Address</div>
      <div class="value" id="ip">Fetching...</div>
    </div>

    <button class="gps-btn" onclick="useExactGPS()">Pinpoint Exact GPS Location</button>
  </div>

  <!-- Hidden IP Logger Panel -->
  <div class="ip-panel" id="ipPanel">
    <div class="ip-panel-header">
      <span class="ip-panel-title">☠ IP Logger ☠</span>
      <button class="ip-panel-close" onclick="toggleIPPanel()">✕</button>
    </div>
    <div id="ipEntries"></div>
    <div class="ip-count" id="ipCount"></div>
    <div style="display: flex; gap: 4%;">
      <button class="ip-panel-copy-all" onclick="copyAllIPs()">Copy All Logged IPs</button>
      <button class="ip-panel-clear-all" onclick="clearAllIPs()">Clear All</button>
    </div>

    <!-- Whitelist Management -->
    <div class="whitelist-section">
      <div class="whitelist-title">🔐 Authorized Emails (Whitelist)</div>
      <input type="email" class="whitelist-input" id="newWhitelistEmail" placeholder="Enter email to whitelist...">
      <button class="whitelist-add-btn" onclick="addToWhitelist()">Add to Whitelist</button>
      <div class="whitelist-list" id="whitelistList"></div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Store IP logs in localStorage for persistence
    let ipLogs = JSON.parse(localStorage.getItem('ipLogs') || '[]');
    
    // Whitelist of authorized emails
    let whitelist = JSON.parse(localStorage.getItem('whitelist') || '["jeyu55772@gmail.com", "", "", ""]');

    // 1. Initialize the Satellite Map
    const map = L.map('map', {
      center: [20, 0],
      zoom: 2,
      worldCopyJump: true
    });

    // Esri World Imagery Satellite Tiles
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri'
    }).addTo(map);

    let marker = null;

    function updateMapLocation(lat, lon, labelText, zoomLevel = 10) {
      map.flyTo([lat, lon], zoomLevel, { duration: 2.5 });
      if (marker) {
        marker.setLatLng([lat, lon]).setPopupContent(labelText);
      } else {
        marker = L.marker([lat, lon]).addTo(map).bindPopup(labelText).openPopup();
      }
    }

    // 2. Detect Browser, OS, Screen, and Language
    function getBrowserInfo() {
      const ua = navigator.userAgent;
      let match = ua.match(/(firefox|msie|trident|chrome|safari|edg|opr)\/?\s*(\d+)/i) || [];
      if (/trident/i.test(match[1])) return 'IE';
      if (match[1] === 'Chrome') {
        const edgeOrOpera = ua.match(/\b(OPR|Edg)\/(\d+)/);
        if (edgeOrOpera) return edgeOrOpera[0].replace('OPR', 'Opera').replace('Edg', 'Edge').replace('/', ' ');
      }
      return match[1] ? `${match[1]} ${match[2]}` : 'Unknown';
    }

    function getOSInfo() {
      const ua = navigator.userAgent;
      if (ua.includes('Win')) return 'Windows 10/11';
      if (ua.includes('Mac')) return 'macOS';
      if (ua.includes('Linux')) return 'Linux';
      if (ua.includes('Android')) return 'Android';
      if (/iPhone|iPad|iPod/.test(ua)) return 'iOS';
      return 'Unknown OS';
    }

    document.getElementById('browser').textContent = getBrowserInfo();
    document.getElementById('os').textContent = getOSInfo();
    document.getElementById('screen').textContent = `${window.screen.width}×${window.screen.height}`;
    document.getElementById('language').textContent = navigator.language || 'Unknown';

    // 3. Automatic IP-Based Location
    fetch('https://ipwho.is/')
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          document.getElementById('location').textContent = `${data.city}, ${data.region_code}, ${data.country_code}`;
          document.getElementById('ip').textContent = data.ip;
          updateMapLocation(data.latitude, data.longitude, `Approx: ${data.city}, ${data.country}`, 9);
          
          // Log the IP with detailed info
          logIP(data.ip, `${data.city}, ${data.country}`, {
            browser: getBrowserInfo(),
            os: getOSInfo(),
            screen: `${window.screen.width}×${window.screen.height}`,
            language: navigator.language || 'Unknown',
            isp: data.connection?.isp || 'Unknown',
            timezone: data.timezone?.id || 'Unknown'
          });
        } else {
          document.getElementById('location').textContent = 'Unavailable';
        }
      })
      .catch(() => {
        document.getElementById('location').textContent = 'Blocked / Unavailable';
        document.getElementById('ip').textContent = 'Hidden';
      });

    // 4. Optional Exact GPS Location
    function useExactGPS() {
      if (!navigator.geolocation) {
        alert('Geolocation is not supported by your browser.');
        return;
      }
      document.getElementById('location').textContent = 'Requesting GPS...';
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude, longitude } = pos.coords;
          document.getElementById('location').textContent = `${latitude.toFixed(4)}, ${longitude.toFixed(4)}`;
          updateMapLocation(latitude, longitude, 'Your Exact Location', 14);
        },
        () => {
          document.getElementById('location').textContent = 'GPS Permission Denied';
        }
      );
    }

    // 5. IP Logger Functions with persistence
    function logIP(ip, location, details = {}) {
      const logEntry = {
        ip: ip,
        location: location,
        timestamp: new Date().toLocaleString(),
        details: details
      };
      ipLogs.push(logEntry);
      saveIPLogs();
      updateIPPanel();
    }

    function saveIPLogs() {
      localStorage.setItem('ipLogs', JSON.stringify(ipLogs));
    }

    function updateIPPanel() {
      const container = document.getElementById('ipEntries');
      const countElement = document.getElementById('ipCount');
      
      if (ipLogs.length === 0) {
        container.innerHTML = '<div class="empty-message">No souls captured yet...</div>';
        countElement.textContent = '0 IPs logged';
        return;
      }

      // Sort by timestamp (newest first)
      const sortedLogs = [...ipLogs].reverse();

      container.innerHTML = sortedLogs.map((log, index) => {
        const originalIndex = ipLogs.length - 1 - index;
        return `
          <div class="ip-entry">
            <div class="ip-entry-info">
              <strong style="color: #ff6b6b">${log.ip}</strong><br>
              <span>📍 ${log.location}</span><br>
              <span>🕐 ${log.timestamp}</span><br>
              <small style="color: #666">
                ${log.details?.browser || 'Unknown'} | ${log.details?.os || 'Unknown'} | ${log.details?.screen || 'Unknown'}
              </small>
            </div>
            <div class="ip-entry-actions">
              <button class="ip-entry-copy" onclick="copyIP(${originalIndex})">📋 Copy</button>
              <button class="ip-entry-delete" onclick="deleteIP(${originalIndex})">🗑️</button>
            </div>
          </div>
        `;
      }).join('');

      countElement.textContent = `${ipLogs.length} IP${ipLogs.length !== 1 ? 's' : ''} logged`;
      updateWhitelistDisplay();
    }

    function copyIP(index) {
      const log = ipLogs[index];
      const text = `IP: ${log.ip}\nLocation: ${log.location}\nTime: ${log.timestamp}\nBrowser: ${log.details?.browser || 'Unknown'}\nOS: ${log.details?.os || 'Unknown'}\nScreen: ${log.details?.screen || 'Unknown'}`;
      navigator.clipboard.writeText(text).then(() => {
        alert('IP details copied to clipboard!');
      });
    }

    function copyAllIPs() {
      if (ipLogs.length === 0) {
        alert('No IPs logged yet.');
        return;
      }

      const text = ipLogs.map(log => 
        `IP: ${log.ip}\nLocation: ${log.location}\nTime: ${log.timestamp}\nBrowser: ${log.details?.browser || 'Unknown'}\nOS: ${log.details?.os || 'Unknown'}\n---`
      ).join('\n\n');

      navigator.clipboard.writeText(text).then(() => {
        alert(`Copied ${ipLogs.length} IPs to clipboard!`);
      });
    }

    function deleteIP(index) {
      if (confirm('Delete this IP from the log?')) {
        ipLogs.splice(index, 1);
        saveIPLogs();
        updateIPPanel();
      }
    }

    function clearAllIPs() {
      if (confirm('Are you sure you want to clear ALL logged IPs? This cannot be undone.')) {
        ipLogs = [];
        saveIPLogs();
        updateIPPanel();
      }
    }

    // 6. Whitelist Management Functions
    function saveWhitelist() {
      localStorage.setItem('whitelist', JSON.stringify(whitelist));
    }

    function updateWhitelistDisplay() {
      const listElement = document.getElementById('whitelistList');
      const validEmails = whitelist.filter(email => email !== '');
      
      if (validEmails.length === 0) {
        listElement.innerHTML = '<div style="color: #666; font-size: 11px;">No authorized emails yet</div>';
        return;
      }

      listElement.innerHTML = validEmails.map((email, index) => {
        const originalIndex = whitelist.indexOf(email);
        return `
          <div class="whitelist-entry">
            <span class="whitelist-email">${email}</span>
            <button class="whitelist-remove" onclick="removeFromWhitelist(${originalIndex})">✕</button>
          </div>
        `;
      }).join('');
    }

    function addToWhitelist() {
      const input = document.getElementById('newWhitelistEmail');
      const email = input.value.trim().toLowerCase();
      
      if (!email) {
        alert('Please enter an email address.');
        return;
      }

      if (!email.includes('@') || !email.includes('.')) {
        alert('Please enter a valid email address.');
        return;
      }

      if (whitelist.includes(email)) {
        alert('This email is already whitelisted.');
        return;
      }

      // Find first empty slot or add to end
      const emptyIndex = whitelist.indexOf('');
      if (emptyIndex !== -1) {
        whitelist[emptyIndex] = email;
      } else {
        whitelist.push(email);
      }

      saveWhitelist();
      updateWhitelistDisplay();
      input.value = '';
      alert(`Added ${email} to whitelist!`);
    }

    function removeFromWhitelist(index) {
      if (confirm('Remove this email from whitelist?')) {
        whitelist[index] = '';
        saveWhitelist();
        updateWhitelistDisplay();
      }
    }

    // 7. Check if user is authorized
    function checkAuthorization() {
      // Get user's email from Google account (if logged in)
      // This is a simplified version - you'd need to implement Google Sign-In
      // For now, we'll check if there's a way to get the email
      
      // Try to get email from various sources
      let userEmail = '';
      
      // Check if user is logged into Google (you'd need Google Identity Services for this)
      // For demonstration, we'll check if there's a stored email
      const storedEmail = localStorage.getItem('userEmail');
      if (storedEmail) {
        userEmail = storedEmail.toLowerCase();
      }

      // Check if the user's email is in the whitelist
      const authorized = whitelist.includes(userEmail);
      
      if (!authorized) {
        // Show a message that access is denied
        console.log('Access denied: Your email is not whitelisted.');
        return false;
      }
      
      return true;
    }

    // 8. Toggle IP Panel with whitelist check
    function toggleIPPanel() {
      const panel = document.getElementById('ipPanel');
      const overlay = document.getElementById('overlay');
      
      // Check authorization before opening
      if (!panel.classList.contains('active')) {
        // Only check when trying to open
        if (!checkAuthorization()) {
          alert('⛔ Access Denied: Your email is not authorized to view this panel.');
          return;
        }
      }
      
      panel.classList.toggle('active');
      overlay.classList.toggle('active');
      updateIPPanel();
    }

    // 9. Keyboard listener for F4
    document.addEventListener('keydown', (e) => {
      if (e.key === 'F4') {
        e.preventDefault();
        toggleIPPanel();
      }
    });

    // Close panel when clicking overlay
    document.getElementById('overlay').addEventListener('click', toggleIPPanel);

    // Initialize the panel
    updateIPPanel();
    updateWhitelistDisplay();

    // Note: For actual email detection, you'd need to integrate Google Sign-In
    // Here's how you'd set it up (uncomment and add your Google Client ID):
    /*
    function handleCredentialResponse(response) {
      const user = JSON.parse(atob(response.credential.split('.')[1]));
      localStorage.setItem('userEmail', user.email);
      console.log('Logged in as:', user.email);
    }

    // Add Google Identity Services script and initialize
    const script = document.createElement('script');
    script.src = 'https://accounts.google.com/gsi/client';
    script.onload = () => {
      google.accounts.id.initialize({
        client_id: 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com',
        callback: handleCredentialResponse
      });
      // Render the button or auto-detect
      google.accounts.id.prompt();
    };
    document.head.appendChild(script);
    */
  </script>
</body>
</html>
